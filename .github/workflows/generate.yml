# 每週日一次：呼叫 Gemini 產生下週一～日共 21 篇（報導、經濟、科學、生物類先用 Google 搜尋取材），
# 用 Cloud TTS 產生朗讀音檔，通過檢查後 commit 並部署。網頁會依台灣時間在 08:00／12:00／18:00 自動上架。
# Secrets：GEMINI_API_KEY（必填）、GOOGLE_TTS_API_KEY（選填，沒設定就不產生音檔）
# Variables（選填）：GEMINI_MODEL、TTS_VOICE_NARRATOR、TTS_VOICE_A、TTS_VOICE_B、TTS_USE_FURIGANA、AUDIO_KEEP_DAYS
name: Generate weekly reading

on:
  schedule:
    - cron: "0 4 * * 0"   # 每週日 台灣 12:00（UTC 04:00）→ 產生下週的內容
  workflow_dispatch:
    inputs:
      week:
        description: "從哪一天開始的 7 天 YYYY-MM-DD（留空＝下週一）"
        required: false
      force:
        description: "已存在也重新產生"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          INPUT_WEEK: ${{ inputs.week }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          ARGS=(--week)
          if [ -n "$INPUT_WEEK" ]; then ARGS+=("$INPUT_WEEK"); fi
          if [ "$INPUT_FORCE" = "true" ]; then ARGS+=(--force); fi
          node scripts/generate.mjs "${ARGS[@]}"

      # 部分文章失敗時，成功的照樣上架（下面兩步用 !cancelled()）
      - name: Generate audio with Cloud TTS
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
          TTS_VOICE_NARRATOR: ${{ vars.TTS_VOICE_NARRATOR }}
          TTS_VOICE_A: ${{ vars.TTS_VOICE_A }}
          TTS_VOICE_B: ${{ vars.TTS_VOICE_B }}
          TTS_USE_FURIGANA: ${{ vars.TTS_USE_FURIGANA }}
          AUDIO_KEEP_DAYS: ${{ vars.AUDIO_KEEP_DAYS }}
        run: node scripts/tts.mjs

      - name: Commit
        id: commit
        if: ${{ !cancelled() }}
        run: |
          node scripts/build-manifest.mjs
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新內容"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "📖 新增一週閱讀 $(TZ=Asia/Taipei date +'%Y-%m-%d')"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # 用 GITHUB_TOKEN 推送的 commit 不會觸發其他 workflow，所以在這裡直接部署
  deploy:
    needs: generate
    if: ${{ !cancelled() && needs.generate.outputs.changed == 'true' }}
    uses: ./.github/workflows/pages.yml
