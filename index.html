<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="日日讀" />
  <title>日日讀日文</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600&family=Noto+Serif+JP:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-timer" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  </svg>

  <header class="navbar" id="navbar">
    <div class="navbar-inner">
      <span class="nav-date" id="nav-date"></span>
      <span class="nav-title">日日讀日文</span>
      <div class="nav-actions">
        <button id="btn-open-vocab" class="icon-btn" type="button" aria-label="單字本">
          <svg class="icon"><use href="#i-book"/></svg>
          <span id="badge-vocab-count" class="badge" hidden>0</span>
        </button>
        <button id="btn-open-settings" class="icon-btn" type="button" aria-label="設定">
          <svg class="icon"><use href="#i-gear"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="large-title">日日讀日文</h1>

    <section class="card stats" aria-label="學習紀錄">
      <div class="stat"><div class="stat-value"><span id="stat-streak">0</span><small>天</small></div><div class="stat-label">連續</div></div>
      <div class="stat"><div class="stat-value"><span id="stat-week">0</span><small>則</small></div><div class="stat-label">近 7 天</div></div>
      <div class="stat"><div class="stat-value" id="stat-accuracy">—</div><div class="stat-label">答對率</div></div>
    </section>
    <section class="card">
      <button id="btn-open-review" class="list-row" type="button">
        <span class="row-icon" style="background:var(--orange)"><svg class="icon icon-sm"><use href="#i-repeat"/></svg></span>
        <span class="row-title">今日複習</span>
        <span class="row-value" id="stat-due">0</span>
        <svg class="icon icon-sm chevron"><use href="#i-chevron"/></svg>
      </button>
    </section>

    <div class="date-strip" style="margin-top:20px" id="day-tabs-container" role="tablist" aria-label="日期"></div>
    <div class="segmented" id="slot-tabs-container" role="tablist" aria-label="時段"></div>

    <div id="load-error" class="banner" hidden></div>

    <div id="content-root" hidden>
      <section class="card hero" id="active-slot-header"></section>

      <div class="segmented" id="section-tabs" role="tablist" aria-label="內容">
        <button type="button" data-section="dialogue">對話</button>
        <button type="button" data-section="article">讀解</button>
        <button type="button" data-section="words">單字</button>
      </div>

      <!-- 對話 -->
      <section id="pane-dialogue">
        <div class="card content-card">
          <div class="content-head">
            <div class="meta-row"><span class="tag" id="dialogue-scene"></span><span id="dialogue-chars"></span></div>
            <div class="content-title" id="dialogue-title"></div>
            <div class="content-note" id="dialogue-tone"></div>
          </div>
          <div class="controls">
            <button id="btn-speak-dialogue" class="pill primary" type="button" aria-label="朗讀對話"></button>
          </div>
          <div class="divider"></div>
          <div class="chat" id="dialogue-lines"></div>
        </div>
      </section>

      <!-- 讀解 -->
      <section id="pane-article" hidden>
        <div class="card content-card">
          <div class="content-head">
            <div class="meta-row"><span class="tag level" id="article-level"></span><span class="tag" id="article-genre"></span><span id="article-chars"></span></div>
            <div class="content-title serif" id="article-title"></div>
          </div>
          <div class="controls">
            <button id="btn-speak-article" class="pill primary" type="button" aria-label="朗讀文章"></button>
            <button id="btn-timer" class="pill" type="button" aria-label="計時閱讀"></button>
          </div>
          <div class="sources" id="article-sources" hidden></div>
          <div class="divider"></div>
          <div class="article" id="article-paragraphs"></div>
        </div>

        <div class="card content-card" id="quiz-card" hidden>
          <div class="quiz-head"><h3>讀解練習</h3><span class="quiz-score" id="quiz-score"></span></div>
          <div id="quiz-list"></div>
          <div class="quiz-actions">
            <button id="btn-quiz-retry" class="pill" type="button" hidden>重新作答</button>
            <button id="btn-quiz-submit" class="pill primary" type="button">提交</button>
          </div>
        </div>
      </section>

      <!-- 單字 -->
      <section id="pane-words" hidden>
        <div class="group-title">對話</div>
        <div class="card" id="dialogue-vocab"></div>
        <div class="group-title">本文單字</div>
        <div class="card" id="article-vocab"></div>
        <div class="group-title">本文文法</div>
        <div class="card" id="article-grammar"></div>
      </section>
    </div>
  </main>

  <!-- 閱讀工具列 -->
  <nav class="toolbar" aria-label="閱讀工具">
    <button id="tool-furigana" class="tool" type="button" aria-label="振假名" title="振假名"><span class="tool-glyph">あ</span></button>
    <button id="tool-highlight" class="tool" type="button" aria-label="常考紅底" title="常考紅底"><span class="tool-glyph">紅</span></button>
    <button id="tool-translation" class="tool" type="button" aria-label="中文翻譯" title="中文翻譯"><span class="tool-glyph">譯</span></button>
    <button id="tool-display" class="tool" type="button" aria-label="顯示設定" title="顯示設定"><span class="tool-glyph">Aa</span></button>
  </nav>

  <div class="backdrop" id="backdrop"></div>

  <!-- 設定 -->
  <div class="sheet" id="sheet-settings" role="dialog" aria-label="設定" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-head"><span></span><h2>設定</h2><button class="done" type="button" data-close>完成</button></div>
    <div class="sheet-body">
      <div class="group-title">顯示</div>
      <div class="group">
        <label class="cell"><span class="cell-label">振假名</span><span class="switch"><input type="checkbox" id="set-furigana"><span></span></span></label>
        <label class="cell"><span class="cell-label">中文翻譯</span><span class="switch"><input type="checkbox" id="set-translation"><span></span></span></label>
        <label class="cell"><span class="cell-label">常考紅底</span><span class="switch"><input type="checkbox" id="set-highlight"><span></span></span></label>
        <div class="cell"><span class="cell-label">紅底級數</span>
          <div class="mini-seg" id="set-hl-levels">
            <button type="button" data-hl-level="N1">N1</button>
            <button type="button" data-hl-level="N2">N2</button>
            <button type="button" data-hl-level="N3">N3↓</button>
          </div>
        </div>
        <div class="cell"><span class="cell-label">字體</span>
          <div class="mini-seg" id="set-font">
            <button type="button" data-font="normal">標準</button>
            <button type="button" data-font="large">大</button>
          </div>
        </div>
      </div>

      <div class="group-title" id="voice-section">朗讀</div>
      <div class="group">
        <div class="cell"><span class="cell-label">聲音</span>
          <select id="select-jp-voice" aria-label="日文聲音"><option value="auto">自動</option></select>
        </div>
        <div class="cell"><span class="cell-label">語速</span>
          <div class="mini-seg" id="set-rate">
            <button type="button" data-rate="0.85">0.85</button>
            <button type="button" data-rate="0.95">0.95</button>
            <button type="button" data-rate="1.05">1.05</button>
          </div>
        </div>
        <div class="cell"><input id="input-openai-key" type="password" placeholder="OpenAI API Key（選填）" autocomplete="off" aria-label="OpenAI API Key" /></div>
      </div>
      <div class="group-foot warn" id="voice-none-hint" hidden>
        找不到日文語音，已停用瀏覽器朗讀。
        <ul>
          <li>Windows：設定 → 時間與語言 → 語音 → 新增「日本語」</li>
          <li>或改用 Edge／Chrome，或手機開啟</li>
        </ul>
      </div>
      <div style="margin-top:12px"><button id="btn-test-voice" class="pill" type="button">試聽</button></div>
    </div>
  </div>

  <!-- 單字本 -->
  <div class="sheet" id="sheet-vocab" role="dialog" aria-label="單字本" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-head"><button class="left" type="button" id="btn-clear-vocab">清空</button><h2>單字本</h2><button class="done" type="button" data-close>完成</button></div>
    <div class="sheet-body">
      <div class="segmented" id="vocab-tabs">
        <button type="button" data-vtab="review">複習</button>
        <button type="button" data-vtab="list">收藏</button>
      </div>
      <div id="vocab-review-pane"></div>
      <div id="vocab-list-pane" hidden></div>
    </div>
  </div>

  <!-- 歷史存檔 -->
  <div class="sheet" id="sheet-archive" role="dialog" aria-label="更早的文章" aria-modal="true">
    <div class="grabber"></div>
    <div class="sheet-head"><span></span><h2>更早的文章</h2><button class="done" type="button" data-close>完成</button></div>
    <div class="sheet-body"><div class="group" id="archive-list"></div></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
